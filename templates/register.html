<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Student Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🎓
            </div>

            <h1>Create Your Account</h1>

            <p class="subtitle">
                Start managing your student expenses
            </p>


            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form action="{{ url_for('register') }}"
                  method="POST">


                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >


                <button type="submit"
                        class="login-button">

                    Create Account

                </button>

            </form>


            <p class="register-text">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Sign In
                </a>

            </p>

        </div>

    </div>

</body>

</html>
