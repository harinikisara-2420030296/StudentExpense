<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                💰
            </div>

            <h1>Hello, Student! 👋</h1>

            <p class="subtitle">
                Welcome back to your Student Expense Tracker
            </p>

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form action="{{ url_for('login') }}"
                  method="POST">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <div class="forgot-password">
                    <a href="#">
                        Forgot Password?
                    </a>
                </div>


                <button type="submit"
                        class="login-button">

                    Sign In

                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <button class="google-button"
                    type="button">

                <span class="google-icon">
                    G
                </span>

                Continue with Google

            </button>


            <p class="register-text">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</body>

</html>
